<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3rd Semester Syllabus - Edumat</title>
<link rel="stylesheet" href="style.css">
<style>
  .nav-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .back-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg-color);
    box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-main);
    text-decoration: none;
    font-weight: bold;
    font-size: 20px;
    cursor: pointer;
    border: none;
  }
  .back-btn:active {
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  }
  
  /* University Header Block */
  .uni-header {
    padding: 24px 20px;
    border-radius: 20px;
    background: var(--bg-color);
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
    margin-bottom: 24px;
    text-align: center;
  }
  .uni-header h2 {
    font-size: 16px;
    font-weight: 800;
    color: var(--accent-dark);
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .uni-header h3 {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .uni-details {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .uni-summary {
    display: inline-flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    background: var(--bg-color);
    padding: 10px 16px;
    border-radius: 12px;
    box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-dark);
  }
  .uni-summary span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Main Course List */
  .course-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .course-card {
    padding: 20px;
    border-radius: 20px;
    background: var(--bg-color);
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    cursor: pointer;
    transition: transform 0.2s;
  }
  .course-card:active {
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  }
  .course-type {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--icon-blue-text);
    margin-bottom: 4px;
  }
  .course-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 12px;
  }
  .course-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .course-meta span {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    background: var(--bg-color);
    padding: 6px 10px;
    border-radius: 8px;
    box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
  }

  /* Specific Syllabus View */
  #syllabus-view {
    display: none;
  }
  .view-header-text h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 4px;
  }
  .view-header-text p {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  /* Progress Bar */
  .progress-wrapper {
    margin-bottom: 24px;
    padding: 16px;
    border-radius: 16px;
    background: var(--bg-color);
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--accent-dark);
  }
  .progress-bar-container {
    height: 10px;
    border-radius: 5px;
    background: var(--shadow-dark);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #22c55e;
    width: 0%;
    transition: width 0.3s ease;
  }

  /* Unit Boxes */
  .unit-box {
    padding: 20px;
    border-radius: 20px;
    background: var(--bg-color);
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    margin-bottom: 16px;
  }
  .unit-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--icon-blue-text);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--shadow-dark);
  }
  
  /* Interactive Checkboxes */
  .topic-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .topic-item:last-child {
    margin-bottom: 0;
  }
  .neumorphic-checkbox {
    appearance: none;
    -webkit-appearance: none;
    min-width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--bg-color);
    box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
    outline: none;
  }
  .neumorphic-checkbox:checked {
    box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
  }
  .neumorphic-checkbox:checked::after {
    content: '✓';
    color: #22c55e;
    font-size: 14px;
    font-weight: bold;
  }
  .topic-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-main);
    transition: color 0.2s;
  }
  .topic-item input:checked + .topic-text {
    color: var(--text-muted);
    text-decoration: line-through;
  }
</style>
</head>

  const svgBook = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>`;
  const svgMarks = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>`;
  const svgCredits = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>`;

  let currentCourseId = null;

  function renderMainList() {
    const container = document.getElementById('courses-container');
    container.innerHTML = '';
    
    syllabusData.forEach(course => {
      const card = document.createElement('div');
      card.className = 'course-card';
      card.onclick = () => renderSyllabus(course.id);
      
      card.innerHTML = `
        <div class="course-type">${course.type}</div>
        <div class="course-title">${course.title}</div>
        <div class="course-meta">
          <span>${svgBook} Code: ${course.code}</span>
          <span>${svgMarks} Marks: ${course.marks}</span>
          <span>${svgCredits} Credits: ${course.credits}</span>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function renderSyllabus(courseId) {
    const course = syllabusData.find(c => c.id === courseId);
    if (!course) return;
    currentCourseId = courseId;

    document.getElementById('edumat-shell').style.display = 'none';
    document.getElementById('main-view').style.display = 'none';
    document.getElementById('syllabus-view').style.display = 'block';
    window.scrollTo(0, 0);

    document.getElementById('view-title').textContent = course.title;
    document.getElementById('view-meta').textContent = `Code: ${course.code} | Marks: ${course.marks} | Credits: ${course.credits}`;

    const unitsContainer = document.getElementById('units-container');
    unitsContainer.innerHTML = '';

    course.units.forEach((unit, unitIndex) => {
      const unitBox = document.createElement('div');
      unitBox.className = 'unit-box';
      
      let itemsHtml = '';
      unit.items.forEach((item, itemIndex) => {
        const storageKey = `edumat_${courseId}_${unitIndex}_${itemIndex}`;
        const isChecked = localStorage.getItem(storageKey) === 'true' ? 'checked' : '';
        
        itemsHtml += `
          <label class="topic-item">
            <input type="checkbox" class="neumorphic-checkbox" onchange="toggleItem('${courseId}', ${unitIndex}, ${itemIndex}, this)" ${isChecked}>
            <span class="topic-text">${item}</span>
          </label>
        `;
      });

      unitBox.innerHTML = `
        <div class="unit-title">${unit.title}</div>
        <div class="unit-content">
          ${itemsHtml}
        </div>
      `;
      unitsContainer.appendChild(unitBox);
    });

    updateProgress(courseId);
  }

  function toggleItem(courseId, unitIndex, itemIndex, checkbox) {
    const storageKey = `edumat_${courseId}_${unitIndex}_${itemIndex}`;
    localStorage.setItem(storageKey, checkbox.checked);
    updateProgress(courseId);
  }

  function updateProgress(courseId) {
    const course = syllabusData.find(c => c.id === courseId);
    if (!course) return;

    let totalItems = 0;
    let completedItems = 0;

    course.units.forEach((unit, unitIndex) => {
      unit.items.forEach((item, itemIndex) => {
        totalItems++;
        const storageKey = `edumat_${courseId}_${unitIndex}_${itemIndex}`;
        if (localStorage.getItem(storageKey) === 'true') {
          completedItems++;
        }
      });
    });

    const percentage = totalItems === 0 ? 0 : Math.round((completedItems / totalItems) * 100);
    document.getElementById('progress-percentage').textContent = `${percentage}%`;
    document.getElementById('progress-fill').style.width = `${percentage}%`;
  }

  function showMainView() {
    document.getElementById('syllabus-view').style.display = 'none';
    document.getElementById('edumat-shell').style.display = 'block';
    document.getElementById('main-view').style.display = 'block';
    window.scrollTo(0, 0);
  }

  renderMainList();
</script>
