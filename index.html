<body>

    <div id="app-container">
        
        <!-- Header -->
        <header class="header neu-outset">
            <div class="header-left">
                <div class="app-icon">
                    <i class="ph-fill ph-book-open-text"></i>
                </div>
                <div class="header-titles">
                    <div class="batch-pill">Batch Resources</div>
                    <h1>Edumat</h1>
                    <p>Your batch's academic<br>resource hub</p>
                </div>
            </div>
            <button class="neu-button neu-outset menu-btn">
                <i class="ph ph-list"></i>
            </button>
        </header>

        <!-- Navigation Tabs (Static Wrapping Container) -->
        <nav class="tabs-container neu-outset">
            <div class="tabs-wrap" id="tabs-wrap-container">
                <!-- Tabs injected by JS -->
            </div>
        </nav>

        <!-- Section Header -->
        <div class="section-header">
            <div class="section-title">
                <h2 id="section-title">Question Banks</h2>
                <p id="section-subtitle">Past papers, model questions and more</p>
            </div>
            <div class="resource-count">
                <i class="ph ph-faders"></i>
                <span id="resource-count-text">0 resources</span>
            </div>
        </div>

        <!-- Cards List -->
        <main class="cards-list" id="cards-container">
            <!-- Cards injected by JS -->
        </main>

        <div class="footer-note">
            <i class="ph ph-graduation-cap"></i> Study smart. Build your future.
        </div>

    </div>

    <script>
        // Data Structure for all requested categories
        const categories = [
            { id: 'qb', name: 'Question Banks', icon: 'ph-file-text', subtitle: 'Past papers, model questions and more' },
            { id: 'ab', name: 'Answer Banks', icon: 'ph-check-square', subtitle: 'Detailed solutions and grading rubrics' },
            { id: 'suggestions', name: 'Suggestions', icon: 'ph-lightbulb', subtitle: 'Important topics and exam focus' },
            { id: 'notices', name: 'Notices', icon: 'ph-bell-ringing', subtitle: 'Important announcements and updates' },
            { id: 'syllabus', name: 'Syllabus', icon: 'ph-book-bookmark', subtitle: 'Course outlines and structures' },
            { id: 'routine', name: 'Routine', icon: 'ph-calendar-blank', subtitle: 'Class and exam schedules' },
            { id: 'notes', name: 'Notes', icon: 'ph-notebook', subtitle: 'Lecture notes and summaries' },
            { id: 'books', name: 'Books', icon: 'ph-books', subtitle: 'Reference books and textbooks' },
            { id: 'sheets', name: 'Sheets', icon: 'ph-files', subtitle: 'Formula sheets and quick references' }
        ];

        const pastelColors = [
            { bg: 'var(--pastel-red-bg)', text: 'var(--pastel-red-txt)' },
            { bg: 'var(--pastel-blue-bg)', text: 'var(--pastel-blue-txt)' },
            { bg: 'var(--pastel-green-bg)', text: 'var(--pastel-green-txt)' },
            { bg: 'var(--pastel-purple-bg)', text: 'var(--pastel-purple-txt)' },
            { bg: 'var(--pastel-orange-bg)', text: 'var(--pastel-orange-txt)' }
        ];

        // Generator for mock items based on category
        function generateMockItems(categoryName) {
            const subjects = ['English', 'Mathematics', 'Physics', 'Chemistry', 'Biology', 'Computer Science'];
            const count = Math.floor(Math.random() * 5) + 3; // 3 to 7 items
            const items = [];
            
            for (let i = 0; i < count; i++) {
                const subject = subjects[i % subjects.length];
                let desc = '';
                
                if (categoryName.includes('Question')) desc = `Previous year questions and model questions for ${subject}.`;
                else if (categoryName.includes('Answer')) desc = `Step-by-step verified solutions for ${subject} past papers.`;
                else if (categoryName.includes('Suggestion')) desc = `Chapter-wise short and broad suggestions for ${subject}.`;
                else desc = `Latest resources and materials updated for ${subject}.`;

                items.push({
                    title: `${subject} ${categoryName.replace(/s$/, '')}`, // Removes plural 's' for title
                    year: '2nd Year',
                    batch: '2026',
                    desc: desc,
                    updated: `1${i + 2} Sep 2026`,
                    iconClass: categoryName.includes('Routine') || categoryName.includes('Notice') ? 'ph-file-image' : 'ph-file-pdf'
                });
            }
            return items;
        }

        let activeTabId = 'qb';

        // DOM Elements
        const tabsWrapContainer = document.getElementById('tabs-wrap-container');
        const cardsContainer = document.getElementById('cards-container');
        const sectionTitleEl = document.getElementById('section-title');
        const sectionSubtitleEl = document.getElementById('section-subtitle');
        const resourceCountEl = document.getElementById('resource-count-text');

        function init() {
            renderTabs();
            renderContent();
        }

        function renderTabs() {
            tabsWrapContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `tab-btn neu-button ${cat.id === activeTabId ? 'active' : 'neu-outset'}`;
                btn.innerHTML = `<i class="ph ${cat.icon}"></i> ${cat.name}`;
                btn.onclick = () => {
                    activeTabId = cat.id;
                    renderTabs(); // Re-render to update active state
                    renderContent(); // Render new cards
                };
                tabsWrapContainer.appendChild(btn);
            });
        }

        function renderContent() {
            const activeCategory = categories.find(c => c.id === activeTabId);
            const items = generateMockItems(activeCategory.name);

            // Update Headers
            sectionTitleEl.textContent = activeCategory.name;
            sectionSubtitleEl.textContent = activeCategory.subtitle;
            resourceCountEl.textContent = `${items.length} resources`;

            // Render Cards
            cardsContainer.innerHTML = '';
            items.forEach((item, index) => {
                const colorTheme = pastelColors[index % pastelColors.length];
                
                const cardHTML = `
                    <div class="card neu-outset">
                        <div class="card-icon-box" style="background-color: ${colorTheme.bg}; color: ${colorTheme.text};">
                            <i class="ph-fill ${item.iconClass}"></i>
                        </div>
                        
                        <div class="card-content">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">
                                <span><i class="ph ph-graduation-cap"></i> ${item.year}</span>
                                <span><i class="ph ph-calendar-blank"></i> ${item.batch}</span>
                            </div>
                            <div class="card-desc">${item.desc}</div>
                            <div class="card-date">
                                <i class="ph ph-clock"></i> Updated: ${item.updated}
                            </div>
                        </div>

                        <div class="card-actions">
                            <button class="neu-button action-btn neu-button-dark" onclick="window.open('#', '_blank')">
                                <i class="ph ph-eye"></i> View Online
                            </button>
                            <button class="neu-button action-btn neu-outset" onclick="window.location.href='#'">
                                <i class="ph ph-download-simple"></i> Download PDF
                            </button>
                            <button class="neu-button neu-outset chevron-btn">
                                <i class="ph ph-caret-right"></i>
                            </button>
                        </div>
                    </div>
                `;
                cardsContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Initialize App on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
